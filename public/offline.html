<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width,initial-scale=1"/>
 <meta name="theme-color" content="#f7f8fb"/>
 <title>Offline — James-Denning</title>
 <style>
  @font-face{font-family:JD Inter;src:url('/fonts/inter-400.woff2') format('woff2');font-weight:400}
  @font-face{font-family:JD Inter;src:url('/fonts/inter-600.woff2') format('woff2');font-weight:600}
  *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f7f8fb url('/design/workspace-curves.svg') center/cover;font-family:JD Inter,system-ui,sans-serif;color:#101114;display:grid;place-items:center;padding:24px}
  main{width:100%;max-width:390px;background:#ffffffdf;border:1px solid #dedfe4;border-radius:20px;padding:34px 28px;text-align:center;box-shadow:0 3px 10px #00000005}
  img{width:50px;height:50px;border-radius:13px}h1{font-size:26px;letter-spacing:-.8px;font-weight:600;margin:22px 0 10px}p{font-size:14px;color:#60616b;line-height:1.65;margin:0 0 24px}button{font:600 14px JD Inter,system-ui,sans-serif;border:1px solid #17191c;border-radius:999px;background:#17191c;color:#fff;min-height:46px;padding:12px 26px;cursor:pointer}button:focus-visible{outline:2px solid #60616b;outline-offset:4px}.brand{font-size:13px;font-weight:600;margin-top:12px}
 </style>
</head>
<body>
 <main>
  <img src="/design/jd-tile.png" alt="" width="50" height="50"/>
  <div class="brand">James-Denning</div>
  <h1>You’re offline</h1>
  <p>No internet connection detected.<br/>Please check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
 </main>
</body>
</html>
