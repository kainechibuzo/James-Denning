<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Offline — JAMES-DENNING</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1A4FA0;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 360px;
      width: 90%;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -.3px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,.75);
      margin-bottom: 28px;
    }
    .school {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,.5);
      margin-bottom: 28px;
    }
    button {
      background: #E8560A;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .3px;
      transition: opacity .15s;
    }
    button:active { opacity: .8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="school">JAMES-DENNING</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected.<br>
       Please check your connection and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
