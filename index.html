<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./jd-mark.svg" />

    <!-- Mobile viewport. Pinch-zoom stays enabled: locking it blocks low-vision users
         from magnifying the workspace, and browsers ignore the lock in any case. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- JAMES-DENNING monochrome product identity -->
    <meta name="theme-color" content="#f6efe4" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Full-screen on Android/iOS when added to home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JAMES-DENNING" />

    <!-- Apple touch icons (Safari "Add to Home Screen") -->
    <link rel="apple-touch-icon" href="/jd-mark.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />


    <meta name="description" content="JAMES-DENNING brings people, operations, billing, performance and communication into one connected workspace." />
    <meta property="og:title" content="JAMES-DENNING — Organization Operations" />
    <meta property="og:description" content="A connected workspace for managing people, operations, billing, performance and communication." />
    <meta property="og:type" content="website" />
    <title>JAMES-DENNING — Organization Operations</title>

    <style>
      /* ── Global typography ──────────────────────────────────────────────
         One authoritative font stack. Previously nothing set a global font,
         so any element (and every native form control) fell back to the
         browser default serif — Times New Roman. A crisp system stack renders
         natively on every OS with zero network latency (important for a PWA on
         slow connections) and no FOUT. */
      /* The workspace is a paper surface with a serif voice; native controls
         must inherit it rather than falling back to Times New Roman. */
      :root {
        --font-sans: 'JD Caslon Text', Georgia, 'Times New Roman', serif,
          "Apple Color Emoji", "Segoe UI Emoji";
        --jd-paper: #f6efe4;
      }
      html, body, #root {
        height: 100%;
        overflow: hidden;   /* Capacitor manages scrolling inside pages */
      }
      html {
        background: #f6efe4;
        font-family: var(--font-sans);
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        background: #f6efe4;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* Form controls do NOT inherit font-family by default — force it, or
         selects/options/textareas leak the serif fallback. */
      button, input, select, textarea, optgroup {
        font-family: inherit;
        font-size: 100%;
      }
      #root {
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* ── Keyboard focus ring ────────────────────────────────────────────
         Only shows for keyboard users (:focus-visible), never on mouse click,
         so it adds accessibility without visual noise for pointer users. */
      *:focus { outline: none; }
      *:focus-visible {
        outline: 2px solid #1e2a52;
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* ── Custom scrollbars ──────────────────────────────────────────────
         Thin, unobtrusive, themed — replaces the chunky default OS bars. */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(100,116,139,.35) transparent;
      }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: rgba(100,116,139,.32);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,.5); background-clip: content-box; }

      /* ── Skeleton shimmer (content-shaped loaders) ──────────────────────── */
      @keyframes skeletonShimmer {
        0%   { background-position: -420px 0; }
        100% { background-position:  420px 0; }
      }

      /* ── Respect reduced-motion preference ──────────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
