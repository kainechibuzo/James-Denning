name: JD Background Execution Dispatcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-background-execution-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    name: Poll durable JD queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poll worker and process available jobs
        env:
          SUPABASE_URL: https://thklwiybjuhrjqrrxyid.supabase.co
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${JD_SECRETS_JSON:-}" ]; then
            echo "::notice title=JD worker not dispatched::Add the JD_SECRETS_JSON repository Actions secret containing JD_WORKER_SECRET. The queue will remain pending until configured."
            exit 0
          fi
          worker_secret="$(node scripts/read-jd-secret.mjs JD_WORKER_SECRET)"
          echo "::add-mask::$worker_secret"
          endpoint="${SUPABASE_URL%/}/functions/v1/jd-execution-worker"
          response="$(curl --silent --show-error --fail-with-body --max-time 540 \
            -X POST "$endpoint" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $worker_secret" \
            --data '{}')"
          echo "$response"
