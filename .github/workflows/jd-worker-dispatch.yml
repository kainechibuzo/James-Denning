name: JD Background Execution Dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: jd-background-execution-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Poll durable JD queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate worker secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JD_WORKER_SECRET: ${{ secrets.JD_WORKER_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$JD_WORKER_SECRET" ]; then
            echo "::notice::SUPABASE_URL / JD_WORKER_SECRET are not configured; skipping durable-queue poll until secrets are set."
            exit 0
          fi
      - name: Poll worker and process available jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JD_WORKER_SECRET: ${{ secrets.JD_WORKER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$JD_WORKER_SECRET" ]; then
            echo "::notice::Secrets not configured; skipping worker poll."
            exit 0
          fi
          endpoint="${SUPABASE_URL%/}/functions/v1/jd-execution-worker"
          response="$(curl --silent --show-error --fail-with-body --max-time 540 \
            -X POST "$endpoint" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $JD_WORKER_SECRET" \
            --data '{}')"
          echo "$response"
