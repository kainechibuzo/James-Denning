name: JD Background Execution Dispatcher
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/jd-worker-dispatch.yml"
      - ".github/workflows/jd-business-monitor.yml"
      - "scripts/read-jd-secret.mjs"
      - "supabase/functions/jd-execution-worker/**"
      - "supabase/functions/jd-task-scheduler/**"
      - "supabase/functions/_shared/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-background-execution-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    name: Dispatch recurring schedules and durable JD jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JD secret bundle and dispatch due work
        env:
          SUPABASE_URL: https://thklwiybjuhrjqrrxyid.supabase.co
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${JD_SECRETS_JSON:-}" ]; then
            echo "::error title=JD worker secret missing::JD_SECRETS_JSON is not configured in GitHub Actions."
            exit 1
          fi
          worker_secret="$(node scripts/read-jd-secret.mjs JD_WORKER_SECRET)"
          echo "::add-mask::$worker_secret"
          base="${SUPABASE_URL%/}/functions/v1"

          scheduler_response="$(curl --silent --show-error --fail-with-body --max-time 60 \
            -X POST "$base/jd-task-scheduler" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $worker_secret" \
            --data '{}')"
          echo "JD scheduler response: $scheduler_response"
          node -e 'const x=JSON.parse(process.argv[1]); if (!x || typeof x.checked !== "number" || !Array.isArray(x.outcomes) || !x.recovery || !x.queue) process.exit(1); console.log("JD scheduler validated:", x.checked, "schedule(s) checked; recovered:", x.recovery.recovered, "failed:", x.recovery.failed, "queued:", x.queue.queued)' "$scheduler_response"

          worker_response="$(curl --silent --show-error --fail-with-body --max-time 150 \
            -X POST "$base/jd-execution-worker" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $worker_secret" \
            --data '{}')"
          echo "JD worker response: $worker_response"
          node -e 'const x=JSON.parse(process.argv[1]); if (!x || typeof x.processed !== "number" || !Array.isArray(x.outcomes) || !x.recovery || !x.queue) process.exit(1); console.log("JD worker validated:", x.processed, "job(s) drained; remaining:", x.pending_count, "continuation:", x.continuation_dispatched, "oldest queued age:", x.queue.oldest_queued_age_seconds, "seconds")' "$worker_response"
