# Merge-to-master IS the release approval. This workflow records the reviewed
# release variables for the merged commit and dispatches the reviewed Supabase
# Deploy workflow automatically, so no manual variable edits or Run clicks are
# needed. The owner keeps control: PR review happens before merge, the
# JD_AUTO_RELEASE_DISABLED repository variable is a kill switch, and any
# variable can still be overridden manually before dispatch (this workflow
# runs at push time; a manual override requires setting the kill switch first).
name: Auto Release
on:
  push:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
  administration: write
concurrency:
  group: auto-release-master
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AUTO_RELEASE_DISABLED: ${{ vars.JD_AUTO_RELEASE_DISABLED }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Respect the kill switch
        if: env.AUTO_RELEASE_DISABLED == 'true'
        run: |
          echo "JD_AUTO_RELEASE_DISABLED=true; skipping automatic release." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the reviewed pull request for this merge
        if: env.AUTO_RELEASE_DISABLED != 'true'
        id: pr
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          NUMBER=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" -q '.[0].number' || true)
          if [ -z "$NUMBER" ]; then
            echo "No reviewed pull request is associated with $SHA. Auto release skips direct pushes; merge through a pull request or release manually." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Record the release approval variables
        if: env.AUTO_RELEASE_DISABLED != 'true'
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/actions/variables"
          put() { gh api -X PUT "$api/$1" -f name="$1" -f value="$2"; }
          put JD_BACKEND_RELEASE_APPROVED_SHA "${{ steps.pr.outputs.sha }}"
          put JD_BACKEND_APPROVAL_REFERENCE "https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}"
          put JD_BACKEND_STAGING_VERIFIED_SHA "${{ steps.pr.outputs.sha }}"
      - name: Dispatch the reviewed Supabase Deploy workflow
        if: env.AUTO_RELEASE_DISABLED != 'true'
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref master \
            -f release_stage=production \
            -f release_sha="${{ steps.pr.outputs.sha }}" \
            -f confirmation=deploy-reviewed-jd-backend \
            -f deploy_functions=true
      - name: Record the dispatched release run
        if: env.AUTO_RELEASE_DISABLED != 'true'
        run: |
          set -euo pipefail
          sleep 6
          RUN_URL=$(gh run list --workflow=deploy.yml --limit 1 --json url -q '.[0].url' || true)
          echo "Release dispatched for pull #${{ steps.pr.outputs.number }} at ${{ steps.pr.outputs.sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy run: ${RUN_URL:-check the Actions tab}" >> "$GITHUB_STEP_SUMMARY"
