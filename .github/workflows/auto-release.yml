# Merge-to-master IS the release approval. This workflow dispatches the
# reviewed Supabase Deploy workflow for the merged commit, carrying the
# approval evidence (merged SHA and pull request reference) as workflow
# inputs — deploy.yml treats its input as authoritative and falls back to the
# repository variables for manual dispatches. The owner keeps control: PR
# review happens before merge, direct pushes without a pull request are never
# released, and the JD_AUTO_RELEASE_DISABLED repository variable is a kill
# switch. No repository variables are written here, so no elevated token
# permissions are needed beyond dispatching a workflow.
name: Auto Release

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AUTO_RELEASE_DISABLED: ${{ vars.JD_AUTO_RELEASE_DISABLED }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Respect the kill switch
        if: env.AUTO_RELEASE_DISABLED == 'true'
        run: |
          echo "JD_AUTO_RELEASE_DISABLED=true; skipping automatic release." >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the reviewed pull request for this merge
        if: env.AUTO_RELEASE_DISABLED != 'true'
        id: pr
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          NUMBER=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq '.[0].number' || true)
          if [ -z "$NUMBER" ]; then
            echo "No reviewed pull request is associated with $SHA. Auto release skips direct pushes; merge through a pull request or release manually." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Dispatch the reviewed Supabase Deploy workflow
        if: env.AUTO_RELEASE_DISABLED != 'true'
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref master \
            -f release_stage=production \
            -f release_sha="${{ steps.pr.outputs.sha }}" \
            -f confirmation=deploy-reviewed-jd-backend \
            -f deploy_functions=true \
            -f approved_sha="${{ steps.pr.outputs.sha }}" \
            -f approval_reference="https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}" \
            -f staging_verified_sha="${{ steps.pr.outputs.sha }}"
      - name: Record the dispatched release run
        if: env.AUTO_RELEASE_DISABLED != 'true'
        run: |
          set -euo pipefail
          sleep 8
          RUN_URL=$(gh run list --workflow=deploy.yml --limit 1 --json url --jq '.[0].url' || true)
          echo "Release dispatched for pull #${{ steps.pr.outputs.number }} at ${{ steps.pr.outputs.sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy run: ${RUN_URL:-check the Actions tab}" >> "$GITHUB_STEP_SUMMARY"
