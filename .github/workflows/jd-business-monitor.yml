name: JD Business Service Monitoring and Execution
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-background-execution-dispatch
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bounded provider health checks
        env:
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${JD_SECRETS_JSON:-}" ]; then
            echo "::error title=JD secret bundle missing::JD_SECRETS_JSON is not configured."
            exit 1
          fi
          worker_secret="$(node scripts/read-jd-secret.mjs JD_BUSINESS_MONITOR_WORKER_SECRET)"
          echo "::add-mask::$worker_secret"
          response="$(curl --silent --show-error --fail-with-body --max-time 90 \
            -X POST "https://thklwiybjuhrjqrrxyid.supabase.co/functions/v1/jd-business-monitor-worker" \
            -H "Authorization: Bearer $worker_secret" \
            -H "Content-Type: application/json" \
            --data '{}')"
          echo "$response"
      - name: Poll and execute queued JD requests
        env:
          SUPABASE_URL: https://thklwiybjuhrjqrrxyid.supabase.co
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${JD_SECRETS_JSON:-}" ]; then
            echo "::error title=JD worker secret bundle missing::JD_SECRETS_JSON is not configured."
            exit 1
          fi
          worker_secret="$(node scripts/read-jd-secret.mjs JD_WORKER_SECRET)"
          echo "::add-mask::$worker_secret"
          endpoint="${SUPABASE_URL%/}/functions/v1/jd-execution-worker"
          response="$(curl --silent --show-error --fail-with-body --max-time 540 \
            -X POST "$endpoint" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $worker_secret" \
            --data '{}')"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if (!x || typeof x.processed !== "number" || !Array.isArray(x.outcomes)) process.exit(1); console.log("JD worker response validated:", x.processed, "message(s) processed")' "$response"
