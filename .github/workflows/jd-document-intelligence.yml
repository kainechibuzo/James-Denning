name: JD Document Intelligence Worker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-document-intelligence-worker
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate worker configuration
        env:
          FUNCTION_URL: ${{ secrets.JD_DOCUMENT_FUNCTION_URL }}
          WORKER_SECRET: ${{ secrets.JD_DOCUMENT_WORKER_SECRET }}
        run: |
          if [ -z "$FUNCTION_URL" ] || [ -z "$WORKER_SECRET" ]; then
            echo "::notice::JD_DOCUMENT_FUNCTION_URL / JD_DOCUMENT_WORKER_SECRET are not configured; skipping document extraction batch."
            exit 0
          fi
      - name: Process a bounded document batch
        env:
          FUNCTION_URL: ${{ secrets.JD_DOCUMENT_FUNCTION_URL }}
          WORKER_SECRET: ${{ secrets.JD_DOCUMENT_WORKER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$FUNCTION_URL" ] || [ -z "$WORKER_SECRET" ]; then
            echo "::notice::Document worker not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 180 \
            -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"limit":10}'
