name: JD Document Intelligence Worker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-document-intelligence-worker
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process a bounded document batch
        env:
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: |
          set -euo pipefail
          worker_secret="$(node scripts/read-jd-secret.mjs JD_DOCUMENT_WORKER_SECRET)"
          echo "::add-mask::$worker_secret"
          curl --fail --silent --show-error --max-time 180 \
            -X POST "https://thklwiybjuhrjqrrxyid.supabase.co/functions/v1/jd-business-document-worker" \
            -H "Authorization: Bearer $worker_secret" \
            -H "Content-Type: application/json" \
            --data '{"limit":10}'
