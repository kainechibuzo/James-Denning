# Recovery deployment: requires a valid Supabase Management API token.
# Connector updates currently fail startup; see the deployment incident record.
name: Repair conversation backend deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/arena/7ea643db-james-denning'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Deploy local source with startup diagnostics
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo '::error::Supabase deployment connection is not configured'; exit 1; }
          for fn in jd-execution-worker jd-automation; do
            if supabase functions deploy "$fn" --project-ref thklwiybjuhrjqrrxyid --use-api --yes > /tmp/deploy.log 2>&1; then
              echo "::notice::$fn deployment succeeded"
            else
              python3 -c 'import pathlib; s=pathlib.Path("/tmp/deploy.log").read_text()[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
              exit 1
            fi
          done
      - name: Credential-free startup and authentication smoke checks
        run: |
          node --input-type=module <<'NODE'
          const base='https://thklwiybjuhrjqrrxyid.supabase.co/functions/v1/';
          const checks=[];
          for(const [name,method,status] of [['jd-automation','POST',401],['jd-automation','OPTIONS',200],['jd-execution-worker','POST',401],['jd-execution-worker','GET',405]]){
            const r=await fetch(base+name,{method,headers:{'Content-Type':'application/json'},...(method==='POST'?{body:'{}'}:{}),signal:AbortSignal.timeout(45000)});
            const body=await r.text(); checks.push({name,method,expected:status,actual:r.status,body:body.slice(0,1500),pass:r.status===status&&!body.includes('BOOT_ERROR')});
          }
          console.log('::notice::'+JSON.stringify({checks}));
          if(checks.some(c=>!c.pass))process.exitCode=1;
          NODE
