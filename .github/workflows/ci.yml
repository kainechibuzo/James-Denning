name: Web CI

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'vercel.json'
      - 'supabase/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Production web build
        run: npm run verify:web

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test JD document intelligence helpers
        run: deno test --node-modules-dir=auto --allow-env supabase/functions/_shared/jd-document-intelligence.test.ts

      - name: Test JD document security screening
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-document-security.test.ts

      - name: Test JD OAuth cryptography helpers
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-oauth-crypto.test.ts

      - name: Test JD business platform migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111210000_jd_business_platform.sql,supabase/functions/jd-business-platform/index.ts,supabase/functions/jd-business-monitor-worker/index.ts,supabase/functions/jd-business-ops-worker/index.ts,supabase/functions/jd-business-document-worker/index.ts,supabase/functions/jd-business-report-share/index.ts,supabase/functions/_shared/jd-business-forecast.ts supabase/functions/_shared/jd-business-platform-migration.test.ts

      - name: Test JD task collaboration migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111184500_jd_task_collaboration.sql supabase/functions/_shared/jd-task-collaboration-migration.test.ts

      - name: Test JD scheduler and assignment migration contracts
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111193000_jd_recurring_tasks_and_assignment.sql supabase/functions/_shared/jd-scheduler-migration.test.ts

      - name: Test JD timezone-aware recurring schedule calculation
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-scheduler.test.ts

      - name: Test JD execution reliability helpers
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-agent-runtime.test.ts

      - name: Test JD workflow definition validation
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-workflow-definition.test.ts

      - name: Test JD workflow versioning and approval contracts
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111200000_jd_workflow_versioned_drafts.sql supabase/functions/_shared/jd-workflow-versioning.test.ts

      - name: Test JD Batch 01 operational intelligence foundations
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111180000_jd_batch01_organisation_operations_hiring.sql supabase/functions/_shared/jd-batch01.test.ts

      - name: Test JD business intelligence aggregations
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-business-intelligence.test.ts

      - name: Test JD durable execution migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111130000_jd_durable_execution_jobs.sql supabase/functions/_shared/jd-execution-migration.test.ts

      - name: Test JD execution worker helpers
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-execution-worker.test.ts

      - name: Test JD settings catalogue privacy and filtering
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-settings-catalogue.test.ts

      - name: Test JD settings intelligence (explain, audit, refuse)
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-settings-intelligence.test.ts

      - name: Test JD expense anomaly detection
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-expense-anomalies.test.ts

      - name: Test JD KPI trends
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-kpi-trends.test.ts

      - name: Test JD settings change planner
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-settings-change-planner.test.ts

      - name: Test JD settings proposal review migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111150000_jd_settings_proposal_review.sql supabase/functions/_shared/jd-settings-proposal-migration.test.ts

      - name: Test JD approved settings executor migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111160000_jd_approved_settings_executor.sql supabase/functions/_shared/jd-settings-executor-migration.test.ts

      - name: Test JD private checkpoint migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111140000_jd_durable_execution_checkpoints.sql supabase/functions/_shared/jd-execution-checkpoint-migration.test.ts

      - name: Test JD manual execution retry migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111190000_jd_execution_retry_controls.sql supabase/functions/_shared/jd-execution-retry-migration.test.ts

      - name: Type-check secured Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/verify-payment/index.ts
          deno check --node-modules-dir=auto supabase/functions/send-email/index.ts
          deno check --node-modules-dir=auto supabase/functions/send-email-batch/index.ts
          deno check --node-modules-dir=auto supabase/functions/scheduled-digest/index.ts
          deno check --node-modules-dir=auto supabase/functions/manage-account/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-automation/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-execution-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-task-scheduler/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-task-collaboration/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-platform/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-oauth-callback/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-document-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-monitor-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-ops-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-report-share/index.ts
