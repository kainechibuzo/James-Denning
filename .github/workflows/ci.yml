name: Web CI

on:
  pull_request:
    branches: [master, fix/verify-web-build-module-entry, feat/jd-assistant-first-workspace]
  push:
    branches-ignore: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'vercel.json'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Test navigation search and mobile drawer behaviour
        run: npm run test:navigation

      - name: Validate checklist coverage and evidence integrity
        run: npm run test:checklist

      - name: Test run history truthfulness and mounted monitor
        run: npm run test:history

      - name: Test operational task client and isolated PostgreSQL transitions
        run: npm run test:tasks

      - name: Production web build
        run: npm run verify:web
      - name: Production mobile build
        run: npm run build:mobile

      # The verification scripts are what stand between us and a green build
      # that verified nothing. This test proves they fail closed, using a
      # stubbed fetch — no network, no credentials, no writes.
      - name: Test verification guards fail closed
        run: node scripts/test-verification-guards.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Supabase Auth and pre-authentication contract
        run: deno test --node-modules-dir=auto --allow-read=src/MobileApp.jsx,src/App.jsx,src/AppDemo.jsx,src/pages/saas-entry.jsx,src/supabaseClient.js,supabase/functions/preauth-lookup/index.ts,supabase/functions/public-careers/index.ts,supabase/migrations/20261115164436_jd_revoke_legacy_public_rpcs.sql,supabase/rollback/20261115164436_jd_revoke_legacy_public_rpcs.rollback.sql supabase/functions/_shared/preauth-auth-contract.test.ts

      - name: Test JD document intelligence helpers
        run: deno test --node-modules-dir=auto --allow-env supabase/functions/_shared/jd-document-intelligence.test.ts

      - name: Test JD document security screening
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-document-security.test.ts

      - name: Test JD OAuth cryptography helpers
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-oauth-crypto.test.ts

      - name: Test JD inbound MCP server security contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/functions/jd-mcp/index.ts,supabase/functions/_shared/jd-agent-runtime.ts,supabase/config.toml supabase/functions/_shared/jd-mcp-server.test.ts

      - name: Test JD MCP JSON Schema conversion
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-mcp-schema.test.ts

      - name: Test JD Connect MCP protocol and migration contracts
        run: |
          deno test --node-modules-dir=auto supabase/functions/_shared/jd-mcp-core.test.ts
          deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261114091134_jd_connect_mcp_platform.sql supabase/functions/_shared/jd-connect-migration.test.ts

      - name: Test JD business platform migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112073746_jd_business_platform.sql,supabase/functions/jd-business-platform/index.ts,supabase/functions/jd-business-monitor-worker/index.ts,supabase/functions/jd-business-ops-worker/index.ts,supabase/functions/jd-business-document-worker/index.ts,supabase/functions/jd-business-report-share/index.ts,supabase/functions/_shared/jd-business-forecast.ts supabase/functions/_shared/jd-business-platform-migration.test.ts

      - name: Test JD task collaboration migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112084602_jd_task_collaboration.sql supabase/functions/_shared/jd-task-collaboration-migration.test.ts

      - name: Test atomic operational task transition audit contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261113200345_jd_atomic_operational_task_transition.sql supabase/functions/_shared/jd-atomic-operational-task-transition.test.ts

      - name: Test JD scheduler and assignment migration contracts
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112084732_jd_recurring_tasks_and_assignment.sql supabase/functions/_shared/jd-scheduler-migration.test.ts

      - name: Test JD timezone-aware recurring schedule calculation
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-scheduler.test.ts

      - name: Test CSP-safe CAE arithmetic evaluator
        run: deno test --node-modules-dir=auto supabase/functions/_shared/arithmetic.test.ts

      - name: Test JD execution reliability helpers
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-agent-runtime.test.ts

      - name: Test JD streamed response parsing and continuation
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-agent-stream.test.ts

      - name: Test JD document file generation validation
        run: deno test --allow-env=READABLE_STREAM --node-modules-dir=auto supabase/functions/_shared/jd-agent-file-generator.test.ts

      - name: Test JD task-based model routing
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-agent-routing.test.ts

      - name: Test JD workflow definition validation
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-workflow-definition.test.ts

      - name: Test JD workflow versioning and approval contracts
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112084827_jd_workflow_versioned_drafts.sql supabase/functions/_shared/jd-workflow-versioning.test.ts

      - name: Test JD Batch 01 operational intelligence foundations
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112084532_jd_batch01_organisation_operations_hiring.sql supabase/functions/_shared/jd-batch01.test.ts

      - name: Test JD business intelligence aggregations
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-business-intelligence.test.ts

      - name: Test JD persisted visual workspace assembly
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-visual-workspace.test.ts

      - name: Test JD durable execution migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111085150_jd_durable_execution_jobs.sql supabase/functions/_shared/jd-execution-migration.test.ts

      - name: Test JD execution worker helpers
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-execution-worker.test.ts

      - name: Test JD settings catalogue privacy and filtering
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-settings-catalogue.test.ts

      - name: Test JD settings intelligence (explain, audit, refuse)
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-settings-intelligence.test.ts

      - name: Test JD expense anomaly detection
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-expense-anomalies.test.ts

      - name: Test JD KPI trends
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-kpi-trends.test.ts

      - name: Test JD settings change planner
        run: deno test --node-modules-dir=auto supabase/functions/_shared/jd-settings-change-planner.test.ts

      - name: Test JD settings proposal review migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112084412_jd_settings_proposal_review.sql supabase/functions/_shared/jd-settings-proposal-migration.test.ts

      - name: Test JD approved settings executor migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112084459_jd_approved_settings_executor.sql supabase/functions/_shared/jd-settings-executor-migration.test.ts

      - name: Test JD private checkpoint migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261111085151_jd_durable_execution_checkpoints.sql supabase/functions/_shared/jd-execution-checkpoint-migration.test.ts

      - name: Test JD manual execution retry migration contract
        run: deno test --node-modules-dir=auto --allow-read=supabase/migrations/20261112084629_jd_execution_retry_controls.sql supabase/functions/_shared/jd-execution-retry-migration.test.ts

      # Supabase deploys selected functions with shared modules nested beside index.ts.
      # Stage that same layout for every entrypoint that imports ./_shared/*.
      - name: Stage nested Edge Function shared modules
        run: |
          for entrypoint in supabase/functions/*/index.ts; do
            if grep -q 'from "./_shared/' "$entrypoint" || grep -q "from './_shared/" "$entrypoint"; then
              function_dir="${entrypoint%/index.ts}"
              mkdir -p "$function_dir/_shared"
              cp supabase/functions/_shared/*.ts "$function_dir/_shared/"
            fi
          done

      - name: Type-check secured Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/verify-payment/index.ts
          deno check --node-modules-dir=auto supabase/functions/send-email/index.ts
          deno check --node-modules-dir=auto supabase/functions/preauth-lookup/index.ts
          deno check --node-modules-dir=auto supabase/functions/public-careers/index.ts
          deno check --node-modules-dir=auto supabase/functions/send-email-batch/index.ts
          deno check --node-modules-dir=auto supabase/functions/scheduled-digest/index.ts
          deno check --node-modules-dir=auto supabase/functions/manage-account/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-automation/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-execution-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-task-scheduler/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-task-collaboration/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-platform/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-connect/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-mcp/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-oauth-callback/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-document-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-monitor-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-ops-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-business-report-share/index.ts
