name: Web CI

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'vercel.json'
      - 'supabase/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production web build
        run: npm run verify:web

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check secured Edge Functions
        run: |
          deno check supabase/functions/verify-payment/index.ts
          deno check supabase/functions/send-email/index.ts
          deno check supabase/functions/send-email-batch/index.ts
          deno check supabase/functions/scheduled-digest/index.ts
          deno check supabase/functions/manage-account/index.ts
