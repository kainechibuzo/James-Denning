# One-shot recovery/deployment for the owner's explicitly confirmed test DB.
# Does not alter the separate staged production-release workflow.
name: Owner-approved OAuth test DB release
on:
  push:
    branches: [arena/3fc25aaf-james-denning]
    paths: [.github/workflows/oauth-testdb-release.yml]
permissions:
  contents: read
concurrency:
  group: supabase-jd-backend-release
  cancel-in-progress: false
jobs:
  deploy:
    # Commits include Arena's co-author trailer after the subject.
    if: startsWith(github.event.head_commit.message, 'Deploy approved OAuth test database release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b51d63089623042caf859afbbabd3afcead7311
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable bundle hashes and unauthenticated boundaries
        run: node --test scripts/test-oauth-deployment-bundles.mjs
      - name: Prepare only the seven approved functions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root='build/oauth-testdb-release';
          const manifest=JSON.parse(fs.readFileSync('deployment/oauth-testdb/manifest.json'));
          if(manifest.sourceSha!=='19ce0114653f01e5e356c77f6ff1c1eba7ee5f10'||manifest.projectRef!=='thklwiybjuhrjqrrxyid')throw Error('Unapproved source/target');
          const functions={'jd-connect':false,'jd-business-oauth-callback':false,'jd-business-platform':true,'jd-automation':true,'jd-execution-worker':false,'jd-mcp':false,'jd-connect-oauth':false};
          if(Object.keys(manifest.functions).sort().join()!==Object.keys(functions).sort().join())throw Error('Unexpected function set');
          fs.mkdirSync(root+'/supabase',{recursive:true});
          let config='project_id = "jd-oauth-testdb-release"\n';
          for(const [name,jwt] of Object.entries(functions)){
            const code=fs.readFileSync('deployment/oauth-testdb/'+name+'.mjs');
            if(manifest.functions[name].verifyJwt!==jwt||crypto.createHash('sha256').update(code).digest('hex')!==manifest.functions[name].bundleSha256)throw Error('Bundle mismatch');
            const dest=root+'/supabase/functions/'+name;
            fs.mkdirSync(dest,{recursive:true});fs.writeFileSync(dest+'/index.ts',code);
            config+='\n[functions.'+name+']\nverify_jwt = '+jwt+'\n';
          }
          fs.writeFileSync(root+'/supabase/config.toml',config);
          NODE
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Deploy compiled bundles through the supported API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::Supabase deployment credential is missing. No secrets are printed.'
            exit 1
          fi
          for name in jd-connect jd-business-oauth-callback jd-business-platform jd-automation jd-execution-worker jd-mcp jd-connect-oauth; do
            if ! supabase functions deploy "$name" --use-api --remote=thklwiybjuhrjqrrxyid --yes --workdir build/oauth-testdb-release > deploy-output.log 2>&1; then
              # Expose only redacted CLI diagnostics through check annotations;
              # the sandbox cannot download GitHub's redirected log archives.
              node --input-type=module -e "import fs from 'node:fs'; let text=fs.readFileSync('deploy-output.log','utf8').replaceAll(process.env.SUPABASE_ACCESS_TOKEN,'[REDACTED]'); console.log('::error::'+text.slice(-2500).replaceAll('%','%25').replaceAll('\\r','%0D').replaceAll('\\n','%0A'));"
              exit 1
            fi
            cat deploy-output.log
          done
      - name: Check deployed startup and unauthenticated HTTP boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://thklwiybjuhrjqrrxyid.supabase.co/functions/v1/';
          const cases=[['jd-connect','GET',405],['jd-connect','POST',401],['jd-connect','OPTIONS',200],['jd-business-oauth-callback','GET',400],['jd-business-platform','POST',401],['jd-automation','POST',401],['jd-execution-worker','GET',405],['jd-execution-worker','POST',401],['jd-mcp','POST',401],['jd-connect-oauth','GET',400],['jd-connect-oauth','POST',401],['jd-connect-oauth','OPTIONS',200]];
          const results=[];
          for(const [name,method,expected] of cases){
            const response=await fetch(base+name,{method,headers:{Origin:'https://james-denning.com.ng','Content-Type':'application/json'},...(method==='POST'?{body:'{}'}:{}),signal:AbortSignal.timeout(60000)});
            const body=await response.text();const cors=response.headers.get('access-control-allow-origin');
            results.push({name,method,expected,actual:response.status,cors,body:body.slice(0,1000),pass:response.status===expected&&!body.includes('BOOT_ERROR')&&(method!=='OPTIONS'||cors==='*')});
          }
          fs.writeFileSync('http-smoke.json',JSON.stringify(results,null,2)+'\n');console.log(JSON.stringify(results,null,2));
          if(results.some(r=>!r.pass))process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-testdb-deployment-receipt
          path: |
            deployment/oauth-testdb/manifest.json
            http-smoke.json
          retention-days: 30
