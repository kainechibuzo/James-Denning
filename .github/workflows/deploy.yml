# Manual, source-pinned compatibility release. No automatic deploys, bulk
# functions deploy, database password, migration push or worker dispatch.
# Environment variables are independent operator attestations, not runtime proof.
# See documentation/JD_BACKEND_RELEASE.md before configuring either environment.
name: Supabase Deploy

on:
  workflow_dispatch:
    inputs:
      release_stage:
        description: "Reviewed environment (production requires same-SHA staging acceptance)"
        type: choice
        options: [staging, production]
        default: staging
        required: true
      release_sha:
        description: "Exact reviewed master commit (40 lowercase hex characters)"
        type: string
        required: true
      confirmation:
        description: "Type deploy-reviewed-jd-backend after reviewing the release plan"
        type: string
        required: true
      deploy_functions:
        description: "Deploy the three reviewed functions after preparing the artifact"
        type: boolean
        default: false
      apply_migrations:
        description: "Apply pending reviewed supabase/migrations at the approved SHA (needs SUPABASE_DB_PASSWORD in the environment)"
        type: boolean
        default: false
      approved_sha:
        description: "Optional: reviewed approval SHA override (auto release passes the merged commit)"
        type: string
        required: false
      approval_reference:
        description: "Optional: reviewed PR/evidence URL override (auto release passes the merged pull request)"
        type: string
        required: false
      staging_verified_sha:
        description: "Optional: staging-verified SHA override (auto release passes the merged commit)"
        type: string
        required: false

concurrency:
  group: supabase-jd-backend-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Do not run a modified workflow from an arbitrary branch with release secrets.
    if: github.ref == 'refs/heads/master'
    environment: supabase-${{ inputs.release_stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JD_RELEASE_STAGE: ${{ inputs.release_stage }}
      JD_RELEASE_EXPECTED_SHA: ${{ inputs.release_sha }}
      JD_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      JD_BACKEND_RELEASE_APPROVED_SHA: ${{ inputs.approved_sha || vars.JD_BACKEND_RELEASE_APPROVED_SHA }}
      JD_BACKEND_APPROVAL_REFERENCE: ${{ inputs.approval_reference || vars.JD_BACKEND_APPROVAL_REFERENCE }}
      JD_BACKEND_PROJECT_REF: ${{ vars.JD_BACKEND_PROJECT_REF }}
      JD_STAGING_PROJECT_REF: ${{ vars.JD_STAGING_PROJECT_REF }}
      JD_BACKEND_STAGING_VERIFIED_SHA: ${{ inputs.staging_verified_sha || vars.JD_BACKEND_STAGING_VERIFIED_SHA }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate approval, identity and prepare source artifact (offline)
        run: node scripts/jd-backend-release.mjs --prepare
      - name: Install test dependencies
        run: npm ci
      - name: Recheck compatibility and release guards
        run: |
          npm run test:backend-release
          npm run test:tasks
          npm run test:execution
          npm run test:capabilities
          npm run test:skills
      - name: Verify artifact against source and approved plan
        run: node scripts/jd-backend-release.mjs --verify
      - name: Retain exact source artifact and manifest
        uses: actions/upload-artifact@v4
        with:
          name: jd-backend-${{ github.sha }}-${{ inputs.release_stage }}
          path: build/jd-backend-release/
          if-no-files-found: error
          retention-days: 30
      - name: Install pinned deployment CLI
        if: inputs.deploy_functions || inputs.apply_migrations
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Apply reviewed database migrations (explicit opt-in)
        id: migrations
        if: inputs.apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # The reviewed manifest is supabase/migrations at the approved SHA; the
          # release gates above already validated it. Dry-run first so the pending
          # set is recorded in the log before anything is applied. Never fall back
          # automatically on failure: review the partial state before retrying.
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::apply_migrations needs SUPABASE_ACCESS_TOKEN configured in the release environment."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            # Migrations are otherwise kept current through the Supabase connection
            # at merge time; never block a release that carries function changes.
            echo "::warning::apply_migrations selected but SUPABASE_DB_PASSWORD is not configured in the release environment; skipping the database push. Keep prod current via the Supabase connection — merged master must not drift."
            echo "migrations=skipped-missing-db-password" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub Actions runners have no IPv6 connectivity and the project's
          # direct DB host (db.<ref>.supabase.co) is IPv6-only, so push through
          # the IPv4 session pooler instead of resolving the direct host.
          JD_DB_POOLER_URL="postgresql://postgres.${JD_BACKEND_PROJECT_REF}:$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$SUPABASE_DB_PASSWORD")@aws-0-eu-west-1.pooler.supabase.com:5432/postgres"
          supabase db push --remote="$JD_DB_POOLER_URL" --dry-run --skip-vault --yes
          supabase db push --remote="$JD_DB_POOLER_URL" --skip-vault --yes
          echo "migrations=applied" >> "$GITHUB_OUTPUT"
      - name: Deploy only the approved compatibility bundle
        if: inputs.deploy_functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/jd-backend-release.mjs --verify
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::The release environment needs its Supabase connection configured."
            exit 1
          fi
          # The output directory has only these three entrypoints and reviewed JWT settings.
          # CLI calls are sequential, NOT atomic. On a failure stop; review partial release
          # metadata before an explicitly approved rollback. Never fall back automatically.
          # --yes answers the CLI v3 non-interactive guard: every human approval gate
          # (approved SHA, confirmation phrase, staging-verified SHA) has already run in
          # the steps above, and CI has no terminal for the prompt to ask.
          for function_name in jd-automation jd-execution-worker jd-mcp; do
            supabase functions deploy "$function_name" --project-ref "$JD_BACKEND_PROJECT_REF" --workdir build/jd-backend-release --yes
          done
      - name: Release boundary summary
        if: success()
        run: |
          echo "Artifact validated. Deployment commands, if selected, completed."
          echo "This workflow does not invoke workers or certify authenticated runtime/business acceptance."
          echo "Migrations apply only when apply_migrations is selected for this dispatch."
          echo "Migration apply outcome: ${{ steps.migrations.outputs.migrations || 'not-selected' }}"
