# Supabase Deploy — apply migrations + deploy edge functions.
#
# Triggers
#   push to master   → deploy EDGE FUNCTIONS ONLY (safe, idempotent).
#   workflow_dispatch → deploy edge functions, and optionally apply migrations.
#
# WHY MIGRATIONS ARE NOT APPLIED AUTOMATICALLY
# --------------------------------------------
# The local migration history and the production history have diverged in
# VERSION NUMBER, not in content. The same migrations were recorded in
# production under different timestamps than the filenames in this repo:
#
#   recorded in production        present in this repo
#   20261111085143              20261110090000_jd_autonomous_automation
#   20261112073746              20261111210000_jd_business_platform
#   ... (14 versions total)     ... (18 filenames total)
#
# A naive `supabase db push` therefore believes 18 migrations are unapplied and
# replays them out of order relative to 14 it believes are missing. Most of the
# statements are idempotent (CREATE TABLE IF NOT EXISTS, CREATE OR REPLACE
# FUNCTION), so this usually "works" — but it re-applies partial migrations in a
# sequence that was never tested, and one non-idempotent statement would fail
# mid-transaction on production.
#
# Until the histories are reconciled (`supabase migration repair` against the
# recorded version numbers, tracked as JD-UPG-175), migration application stays
# a deliberate, reviewed, manual action. Deploying FUNCTION CODE is separate,
# has no schema effect, and is safe to automate.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — personal access token from
#       https://supabase.com/dashboard/account/tokens
#       Needed for every run. This is the only credential a function deploy uses.
#   SUPABASE_DB_PASSWORD  — database password of project thklwiybjuhrjqrrxyid
#       Needed ONLY when apply_migrations is set. Absent → migration runs fail
#       early with a clear message instead of a confusing link error.
#   JD_SECRETS_JSON       — JSON bundle containing the generated JD worker and
#       OAuth encryption random strings. The post-deploy probe reads the worker
#       value from this bundle; do not commit the bundle to source control.
# The project ref itself is not secret (already committed in config.toml).

name: Supabase Deploy

on:
  push:
    branches: [master]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Also apply pending migrations (dangerous: see header note)"
        type: boolean
        default: false
      deploy_functions:
        description: "Deploy edge functions"
        type: boolean
        default: true

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  # SUPABASE_DB_PASSWORD is deliberately NOT global. Deploying functions needs
  # only the access token; requiring the database password for a function-only
  # deploy couples two unrelated credentials and lets a stale DB password break
  # a deploy that never touches the database.
  SUPABASE_PROJECT_ID: thklwiybjuhrjqrrxyid

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast when the access token is absent
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be set as a repository secret."
            exit 1
          fi

      # Turns an opaque failure deep inside `link`/`deploy` into a named step.
      # Both of those fail with unhelpful messages (or none) when the token is
      # expired, revoked or scoped to a different organisation, which is
      # indistinguishable from a code problem without this check.
      - name: Verify the access token and project access
        run: |
          code=$(curl -s -o /tmp/projects.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects)
          if [ "$code" != "200" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN was rejected by the Supabase API (HTTP $code)."
            echo "Regenerate it at https://supabase.com/dashboard/account/tokens and update the repository secret."
            head -c 300 /tmp/projects.json || true
            exit 1
          fi
          if ! grep -q "$SUPABASE_PROJECT_ID" /tmp/projects.json; then
            echo "::error::The token is valid but cannot see project $SUPABASE_PROJECT_ID."
            echo "It probably belongs to a different organisation or account."
            exit 1
          fi
          echo "Access token valid and project visible."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # `supabase link` verifies the database password, which function deploys do
      # not need. Linking is therefore scoped to the migration path only, so a
      # function-only deploy cannot be blocked by an unrelated DB credential.
      - name: Require the database password for migration runs
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::apply_migrations was requested but SUPABASE_DB_PASSWORD is not set."
            exit 1
          fi

      - name: Link project (migrations only)
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # ── Migrations (manual dispatch only, explicit opt-in) ──────────────────
      - name: Report migration drift before applying
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Local migrations not yet recorded in production history:"
          supabase migration list --project-ref "$SUPABASE_PROJECT_ID" || true
          echo "::warning::Local and remote migration versions are known to diverge; review the list above before applying."

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

      # ── Edge functions (automated) ──────────────────────────────────────────
      # No function name = deploy ALL functions in supabase/functions.
      # Per-function JWT settings come from supabase/config.toml.
      - name: Deploy edge functions
        if: github.event_name == 'push' || inputs.deploy_functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      # Informational — list deployed functions + their JWT mode in the log.
      - name: List deployed functions
        if: always()
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_ID" || true

  # Runs AFTER the deploy job so the assertion is made against the code that was
  # just shipped, not the previous revision. Verifies each worker is reachable
  # AND rejects unauthenticated / wrongly-authenticated calls (fail-closed).
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe edge functions for fail-closed behaviour
        env:
          # Project ref is not secret — it is already committed in config.toml.
          # Written literally rather than via ${{ env.* }} because the env
          # context is not reliably resolvable inside a job-level `env:` block.
          SUPABASE_URL: https://thklwiybjuhrjqrrxyid.supabase.co
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: node scripts/probe-edge-functions.mjs
