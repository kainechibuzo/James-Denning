name: JD Recurring Task Scheduler
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-recurring-task-scheduler
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate scheduler secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JD_WORKER_SECRET: ${{ secrets.JD_WORKER_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$JD_WORKER_SECRET" ]; then
            echo "::notice::SUPABASE_URL / JD_WORKER_SECRET are not configured; skipping recurring-task dispatch until secrets are set."
            exit 0
          fi
      - name: Dispatch due recurring operational tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JD_WORKER_SECRET: ${{ secrets.JD_WORKER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$JD_WORKER_SECRET" ]; then
            echo "::notice::Secrets not configured; skipping scheduler dispatch."
            exit 0
          fi
          endpoint="${SUPABASE_URL%/}/functions/v1/jd-task-scheduler"
          curl --silent --show-error --fail-with-body --max-time 240 \
            -X POST "$endpoint" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $JD_WORKER_SECRET" \
            --data '{}'
