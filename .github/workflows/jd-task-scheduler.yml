name: JD Recurring Task Scheduler
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-recurring-task-scheduler
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dispatch due recurring operational tasks
        env:
          SUPABASE_URL: https://thklwiybjuhrjqrrxyid.supabase.co
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: |
          set -euo pipefail
          worker_secret="$(node scripts/read-jd-secret.mjs JD_WORKER_SECRET)"
          echo "::add-mask::$worker_secret"
          endpoint="${SUPABASE_URL%/}/functions/v1/jd-task-scheduler"
          curl --silent --show-error --fail-with-body --max-time 240 \
            -X POST "$endpoint" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $worker_secret" \
            --data '{}'
