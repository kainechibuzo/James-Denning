name: JD Recurring Task Scheduler
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: jd-recurring-task-scheduler
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate scheduler secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JD_WORKER_SECRET: ${{ secrets.JD_WORKER_SECRET }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$JD_WORKER_SECRET" || { echo "::error::Missing JD_WORKER_SECRET repository secret"; exit 1; }
      - name: Dispatch due recurring operational tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JD_WORKER_SECRET: ${{ secrets.JD_WORKER_SECRET }}
        run: |
          set -euo pipefail
          endpoint="${SUPABASE_URL%/}/functions/v1/jd-task-scheduler"
          curl --silent --show-error --fail-with-body --max-time 240 \
            -X POST "$endpoint" \
            -H "Content-Type: application/json" \
            -H "x-jd-worker-secret: $JD_WORKER_SECRET" \
            --data '{}'
