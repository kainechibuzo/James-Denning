name: Verify application

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, fix/repo-wide-identity-security-overhaul]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify production web build, navigation and bundle budget
        run: npm run verify:web
      - name: Build default application
        run: npm run build
