name: Verify application

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, fix/repo-wide-identity-security-overhaul]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test staging safety and verification guards
        run: npm run test:guards
      - name: Test navigation search and mobile drawer behaviour
        run: npm run test:navigation
      - name: Test backend assignment compatibility and release safety
        run: npm run test:backend-release

      - name: Test capability interpretation and role boundaries
        run: npm run test:capabilities

      - name: Test reviewed organisation settings and SQL execution
        run: npm run test:settings

      - name: Test chat layout in Chromium
        run: npm run test:chat-layout

      - name: Validate checklist coverage and evidence integrity
        run: npm run test:checklist

      - name: Test execution monitor, endpoint authority and retry SQL
        run: npm run test:execution

      - name: Test run history truthfulness and mounted monitor
        run: npm run test:history

      - name: Test operational task client and isolated PostgreSQL transitions
        run: npm run test:tasks
      - name: Verify production web build, navigation and bundle budget
        run: npm run verify:web
      - name: Build default application
        run: npm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test CSP-safe CAE arithmetic evaluator
        run: deno test --node-modules-dir=auto supabase/functions/_shared/arithmetic.test.ts

      - name: Test JD Connect execution truthfulness and MCP evidence tools
        run: |
          deno test --node-modules-dir=auto --allow-read=supabase/functions/jd-connect/index.ts supabase/functions/_shared/jd-connect-execution.test.ts
          deno test --node-modules-dir=auto --allow-read=supabase/functions/jd-mcp/index.ts,supabase/functions/_shared/jd-agent-runtime.ts,supabase/config.toml supabase/functions/_shared/jd-mcp-server.test.ts
      - name: Type-check JD MCP functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/jd-connect/index.ts
          deno check --node-modules-dir=auto supabase/functions/jd-mcp/index.ts
