name: Configure production Supabase Auth

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/configure-supabase-auth.yml"

permissions:
  contents: read

jobs:
  configure-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Update and verify production Auth redirects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: thklwiybjuhrjqrrxyid
          SITE_URL: https://james-denning.com.ng
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Supabase Auth settings were not changed. Configure SUPABASE_ACCESS_TOKEN with a Supabase Management API personal access token."
            exit 1
          fi

          auth_status="$(curl --silent --output /tmp/supabase-auth.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          if [ "$auth_status" = "401" ] || [ "$auth_status" = "403" ]; then
            echo "::error::Supabase Management API rejected the token (HTTP $auth_status)."
            exit 1
          fi
          if [ "$auth_status" != "200" ]; then
            echo "::error::Could not read Supabase Auth settings (HTTP $auth_status)."
            cat /tmp/supabase-auth.json
            exit 1
          fi
          current="$(cat /tmp/supabase-auth.json)"

          existing="$(printf '%s' "$current" | jq -r '.uri_allow_list // ""')"
          filtered="$(printf '%s' "$existing" | tr ',' '\\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -Ev 'localhost|james-denning-james-projects-57651351\\.vercel\\.app' || true)"
          allow_list="$(printf '%s\\n' "$filtered" "https://james-denning.com.ng" "https://james-denning.com.ng/**" "https://james-denning-james-projects-57651351.vercel.app/**" "https://*-james-projects-57651351.vercel.app/**" | sed '/^$/d' | awk '!seen[$0]++' | paste -sd, -)"

          # Keep this workflow focused on redirect configuration. Password
          # breach protection is a separate Auth security setting and must not
          # block production URL/allow-list repair.
          payload="$(jq -n --arg site_url "$SITE_URL" --arg uri_allow_list "$allow_list" \
            '{site_url:$site_url, uri_allow_list:$uri_allow_list}')"

          patch_status="$(curl --silent --output /tmp/supabase-auth-patch.json --write-out '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          if [ "$patch_status" != "200" ]; then
            echo "::error::Supabase rejected the Auth redirect update (HTTP $patch_status). Response:"
            cat /tmp/supabase-auth-patch.json
            exit 1
          fi

          verified_status="$(curl --silent --output /tmp/supabase-auth-verified.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          if [ "$verified_status" != "200" ]; then
            echo "::error::Could not verify Auth redirect settings (HTTP $verified_status)."
            cat /tmp/supabase-auth-verified.json
            exit 1
          fi

          jq -e --arg site "$SITE_URL" \
            '.site_url == $site and (.uri_allow_list | contains("james-denning.com.ng"))' \
            /tmp/supabase-auth-verified.json >/dev/null
          echo "Production Supabase Auth Site URL and redirect allow-list verified."
