name: Configure production Supabase Auth

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/configure-supabase-auth.yml"

permissions:
  contents: read

jobs:
  configure-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Update production Auth URL and password security
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: thklwiybjuhrjqrrxyid
          SITE_URL: https://james-denning-james-projects-57651351.vercel.app
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; Auth dashboard settings were not changed."
            exit 0
          fi

          current="$(curl --fail --silent --show-error \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          existing="$(printf '%s' "$current" | jq -r '.uri_allow_list // ""')"
          filtered="$(printf '%s' "$existing" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -Ev 'localhost|rgs-portal-master\.vercel\.app' || true)"
          allow_list="$(printf '%s\n' "$filtered" "https://james-denning-james-projects-57651351.vercel.app" "https://james-denning-james-projects-57651351.vercel.app/**" | sed '/^$/d' | awk '!seen[$0]++' | paste -sd, -)"

          payload="$(jq -n --arg site_url "$SITE_URL" --arg uri_allow_list "$allow_list" \
            '{site_url:$site_url, uri_allow_list:$uri_allow_list, password_hibp_enabled:true}')"

          curl --fail --silent --show-error -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" >/dev/null

          verified="$(curl --fail --silent --show-error \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          echo "$verified" | jq -e --arg site "$SITE_URL" \
            '.site_url == $site and .password_hibp_enabled == true and (.uri_allow_list | contains("james-denning-james-projects-57651351.vercel.app"))' >/dev/null
          echo "Supabase Auth URL and leaked-password protection verified."
