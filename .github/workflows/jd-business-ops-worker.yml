name: JD Business Operations Worker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process SLA escalations and queued notifications
        env:
          JD_SECRETS_JSON: ${{ secrets.JD_SECRETS_JSON }}
        run: |
          set -euo pipefail
          worker_secret="$(node scripts/read-jd-secret.mjs JD_BUSINESS_OPS_WORKER_SECRET)"
          echo "::add-mask::$worker_secret"
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST "https://thklwiybjuhrjqrrxyid.supabase.co/functions/v1/jd-business-ops-worker" \
            -H "Authorization: Bearer $worker_secret" \
            -H "Content-Type: application/json" \
            --data '{"limit":50}'
