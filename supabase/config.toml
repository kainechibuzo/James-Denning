# Supabase project configuration.
# Public registration is intentionally handled inside manage-account's
# register_school action; the JD automation endpoint requires a user JWT.
project_id = "thklwiybjuhrjqrrxyid"

[functions.manage-account]
verify_jwt = false

[functions.jd-automation]
verify_jwt = true

[functions.jd-execution-worker]
# The worker authenticates with a dedicated server-side secret header.
verify_jwt = false

[functions.jd-task-scheduler]
# Scheduler uses the same dedicated internal secret as the execution worker.
verify_jwt = false

[functions.jd-task-collaboration]
verify_jwt = true

[functions.jd-business-platform]
verify_jwt = true

[functions.jd-business-oauth-callback]
verify_jwt = false

[functions.jd-business-monitor-worker]
verify_jwt = false

[functions.jd-business-document-worker]
verify_jwt = false

[functions.jd-business-ops-worker]
# This worker validates its own dedicated bearer secret.
verify_jwt = false

[functions.jd-business-report-share]
# Public endpoint validates a high-entropy expiring share token itself.
verify_jwt = false

[functions.jd-connect]
# The function validates user JWTs and internal service-role calls itself.
verify_jwt = false

# OAuth 2.1 identity provider for ChatGPT and other MCP clients.
# Dynamic client registration is required by MCP clients; each grant still
# requires an authenticated user to review and approve the requested access.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[functions.jd-mcp]
# OAuth discovery and token verification are handled by @supabase/server.
verify_jwt = false

[functions.jd-connect-oauth]
# Public callback consumes one-time state; POST validates a human user JWT.
verify_jwt = false

[functions.jd-billing]
# Authenticated billing API; the handler also verifies the user JWT and workspace role.
verify_jwt = true

[functions.jd-paystack-webhook]
# Public provider callback; request authenticity is enforced with Paystack HMAC signatures.
verify_jwt = false
